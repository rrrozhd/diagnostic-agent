[project]
name = "diagnostic-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openrouter>=0.2.9",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
